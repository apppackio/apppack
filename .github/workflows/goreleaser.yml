---
name: goreleaser

on:
  pull_request:
  # Branch pushes are covered by `pull_request`, so `push` is limited to
  # main and release tags. A bare `push:` here would build every PR twice.
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Remove nightly tag locally
        # The nightly workflow creates a `nightly` tag at HEAD daily. In snapshot
        # mode, goreleaser picks it up as the current tag and fails because it
        # isn't valid semver. Deleting it locally lets goreleaser fall back to
        # the latest v* tag. No effect on tagged release runs.
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: git tag -d nightly 2>/dev/null || true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "flags=--snapshot" >> $GITHUB_ENV
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.19.0'
          args: release --clean ${{ env.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Upload Windows binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apppack_windows_amd64
          path: dist/apppack_windows_amd64_v1
      - name: Upload Darwin binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apppack_darwin_amd64
          path: dist/apppack_darwin_amd64_v1
      - name: Upload Darwin binary (ARM)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apppack_darwin_arm64
          path: dist/apppack_darwin_arm64
      - name: Upload Linux binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apppack_linux_amd64
          path: dist/apppack_linux_amd64_v1
