---
name: tests

on:
  pull_request:
  # Branch pushes are covered by `pull_request`, so `push` is limited to
  # main. A bare `push:` here would run everything twice on every PR.
  push:
    branches:
      - main

jobs:
  # `go test ./...` covers the package tests and the testscript-driven CLI
  # tests in integration_test.go, so this is not a unit-test-only job.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
      - name: Test
        run: go test ./... -v -cover -coverprofile=coverage.out
      # `go tool cover -func` is deliberately not used for the total. It
      # only attributes blocks that land inside an *ast.FuncDecl, so every
      # `Run: func(...)` hanging off a package-level `&cobra.Command{...}`
      # is left out -- that is most of cmd/, and the total comes out
      # several points high. Summing the profile's own statement counts
      # agrees with the per-package figures `go test -cover` prints.
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "No coverage profile was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo
            awk '
              NR > 1 {
                pkg = $1
                sub(/:[0-9]+\.[0-9]+,[0-9]+\.[0-9]+$/, "", pkg)
                sub(/\/[^\/]+$/, "", pkg)
                sub(/^github\.com\/apppackio\/apppack\/?/, "", pkg)
                if (pkg == "") pkg = "(root)"
                stmts[pkg] += $2
                total += $2
                if ($3 > 0) { hit[pkg] += $2; covered += $2 }
              }
              END {
                if (total == 0) { print "The coverage profile is empty."; exit }
                printf "**%.1f%%** of %d statements\n\n", covered * 100 / total, total
                print "| Package | Coverage | Statements |"
                print "|---|---:|---:|"
                # Least-covered first. Sorted here rather than through
                # `sort` so the header lines stay out of the pipeline.
                n = 0
                for (p in stmts) { n = n + 1; name[n] = p }
                for (i = 2; i <= n; i++) {
                  key = name[i]
                  pct = hit[key] * 100 / stmts[key]
                  j = i - 1
                  while (j >= 1 && hit[name[j]] * 100 / stmts[name[j]] > pct) {
                    name[j + 1] = name[j]
                    j = j - 1
                  }
                  name[j + 1] = key
                }
                for (i = 1; i <= n; i++) {
                  p = name[i]
                  printf "| `%s` | %.1f%% | %d |\n", p, hit[p] * 100 / stmts[p], stmts[p]
                }
              }
            ' coverage.out
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
      - name: Vet
        run: go vet ./...
      # Same tool as `make fmt` and `make lint`, so a clean local run is a
      # clean CI run. golangci-lint-action can't be used here: it only ever
      # invokes `golangci-lint run`, with no way to also select `fmt`.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      # Fails if .golangci.toml uses keys this version does not understand.
      # The config previously declared version 2 while written in v1 syntax,
      # so every unrecognised key -- including the linter set and every
      # exclusion -- was silently ignored for an unknown length of time.
      - name: Verify lint config
        run: golangci-lint config verify
      - name: Format
        run: golangci-lint fmt --diff
      - name: Lint
        run: golangci-lint run
